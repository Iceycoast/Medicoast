services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicoast-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:18
    container_name: medicoast-db
    environment:
      POSTGRES_DB: medicoast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - medicoast_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicoast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medicoast_postgres_data: